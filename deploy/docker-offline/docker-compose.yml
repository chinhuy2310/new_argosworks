version: '3.8'

services:
  argos-works:
    image: argos-works:latest
    container_name: argos-works
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - HOST=0.0.0.0
      - PORT=8080
      - ARGOS_MASTER_KEY=${ARGOS_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-argos_admin}:${POSTGRES_PASSWORD:-argos_secure_password_2026}@postgres:5432/${POSTGRES_DB:-argos_works}
      - ALLOW_PUBLIC_REGISTER=${ALLOW_PUBLIC_REGISTER:-false}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: argos-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - argos-works

  postgres:
    image: postgres:16-alpine
    container_name: argos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos_works}
      POSTGRES_USER: ${POSTGRES_USER:-argos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argos_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argos_admin} -d ${POSTGRES_DB:-argos_works}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
